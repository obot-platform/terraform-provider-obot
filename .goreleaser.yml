# See https://goreleaser.com for configuration documentation.
version: 2
project_name: terraform-provider-obot
snapshot:
  # Terraform and OpenTofu lowercase prerelease versions found in a local
  # mirror, so an uppercase SNAPSHOT never matches an exact version constraint.
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'
before:
  hooks:
    - go mod tidy
builds:
- env:
    # Static binaries run in CI/CD systems such as HCP Terraform that
    # cannot install system libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.version={{.Version}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
    - s390x
  ignore:
    - goos: darwin
      goarch: '386'
    - goos: darwin
      goarch: s390x
    - goos: freebsd
      goarch: s390x
    - goos: windows
      goarch: arm
    - goos: windows
      goarch: s390x
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- formats:
  - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
changelog:
  disable: true
